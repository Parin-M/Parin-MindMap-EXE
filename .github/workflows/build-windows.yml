name: Build Parin MindMap (Windows)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-models:
    name: Prepare Harrier + Gemma local AI stack
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Parin MindMap
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers==4.57.0" "accelerate>=1.10" "bitsandbytes>=0.46.0" safetensors sentencepiece huggingface_hub

      - name: Checkout current llama.cpp for GGUF conversion
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama-convert

      - name: Build llama-quantize
        run: |
          cmake -S llama-convert -B llama-convert/build \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_BLAS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TESTS=OFF
          cmake --build llama-convert/build --config Release --target llama-quantize --parallel

      - name: Download Harrier Q4_K_M
        run: |
          mkdir -p runtime/models
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          hf_hub_download(
              repo_id="mradermacher/harrier-oss-v1-0.6b-GGUF",
              filename="harrier-oss-v1-0.6b.Q4_K_M.gguf",
              local_dir="runtime/models",
              local_dir_use_symlinks=False,
              resume_download=True,
          )
          PY

      - name: Convert requested Gemma BnB checkpoint to GGUF
        run: |
          set -euo pipefail
          rm -rf runtime/gemma-fp16
          mkdir -p runtime/gemma-fp16

          python - <<'PY'
          import shutil, traceback, torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          target = "ishu-newaz/Gemma3-1B-FP16-bnb-4bit"
          fallback = "ishu-newaz/Gemma3-1B-FP16"
          used = target

          try:
              print("Loading requested BnB checkpoint:", target)
              model = AutoModelForCausalLM.from_pretrained(
                  target,
                  device_map="cpu",
                  torch_dtype=torch.float16,
                  low_cpu_mem_usage=True,
              )
              print("Dequantizing requested BnB checkpoint...")
              model.dequantize()
              model.save_pretrained("runtime/gemma-fp16", safe_serialization=True)
              AutoTokenizer.from_pretrained(target).save_pretrained("runtime/gemma-fp16")
          except Exception as exc:
              print("Requested BnB dequantization failed:", repr(exc))
              traceback.print_exc()
              print("Using the author's matching FP16 sibling checkpoint for GGUF deployment.")
              used = fallback
              shutil.rmtree("runtime/gemma-fp16", ignore_errors=True)
              model = AutoModelForCausalLM.from_pretrained(
                  fallback,
                  device_map="cpu",
                  torch_dtype=torch.float16,
                  low_cpu_mem_usage=True,
              )
              model.save_pretrained("runtime/gemma-fp16", safe_serialization=True)
              AutoTokenizer.from_pretrained(fallback).save_pretrained("runtime/gemma-fp16")

          with open("runtime/gemma-source.txt", "w", encoding="utf-8") as f:
              f.write("Requested source: "+target+"\n")
              f.write("GGUF conversion source: "+used+"\n")
              f.write("Deployment format: GGUF Q4_K_M for llama.cpp\n")
          PY

          python llama-convert/convert_hf_to_gguf.py runtime/gemma-fp16 \
            --outfile runtime/models/Gemma3-1B-FP16-bnb-4bit-f16.gguf \
            --outtype f16

          ./llama-convert/build/bin/llama-quantize \
            runtime/models/Gemma3-1B-FP16-bnb-4bit-f16.gguf \
            runtime/models/Gemma3-1B-FP16-bnb-4bit-Q4_K_M.gguf Q4_K_M

          rm -f runtime/models/Gemma3-1B-FP16-bnb-4bit-f16.gguf
          rm -rf runtime/gemma-fp16

          python - <<'PY'
          import os
          for p in [
              "runtime/models/harrier-oss-v1-0.6b.Q4_K_M.gguf",
              "runtime/models/Gemma3-1B-FP16-bnb-4bit-Q4_K_M.gguf",
          ]:
              if not os.path.exists(p):
                  raise SystemExit("Missing "+p)
              with open(p, "rb") as f:
                  if f.read(4) != b"GGUF":
                      raise SystemExit("Invalid GGUF file: "+p)
              print(p, os.path.getsize(p), "bytes")
          PY

      - name: Write bundled AI notice
        run: |
          cat > runtime/ai-notice.txt <<'EOF'
          Parin MindMap bundled local AI

          Semantic context / memory:
          Microsoft Harrier OSS v1 0.6B, Q4_K_M GGUF
          Source: https://huggingface.co/mradermacher/harrier-oss-v1-0.6b-GGUF
          License: MIT

          Assistant / reasoning:
          ishu-newaz/Gemma3-1B-FP16-bnb-4bit lineage
          Deployment: GGUF Q4_K_M generated during this build
          Source: https://huggingface.co/ishu-newaz/Gemma3-1B-FP16-bnb-4bit
          Repository-declared license: Apache-2.0
          Underlying Gemma terms: https://ai.google.dev/gemma/terms

          Runtime:
          llama.cpp, MIT
          Source: https://github.com/ggml-org/llama.cpp

          Architecture:
          Harrier retrieves relevant map context first. Gemma then produces a task-oriented response or a supervised Agent plan. The app applies structural map changes only after user approval.
          EOF

      - name: Upload prepared AI models
        uses: actions/upload-artifact@v4
        with:
          name: parin-local-ai-models
          path: |
            runtime/models/*.gguf
            runtime/ai-notice.txt
            runtime/gemma-source.txt
          if-no-files-found: error
          retention-days: 2

  build-windows:
    name: Build Parin MindMap Windows
    needs: prepare-models
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout Parin MindMap
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Download prepared AI models
        uses: actions/download-artifact@v4
        with:
          name: parin-local-ai-models
          path: runtime

      - name: Install Node dependencies without Electron binary download
        shell: pwsh
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          if ($LASTEXITCODE -ne 0) {
            Write-Host "npm install failed; retrying once..."
            npm cache verify
            npm install --no-audit --no-fund --ignore-scripts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Checkout llama.cpp Windows 7 compatible revision
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama-src
          Set-Location llama-src
          git fetch --no-tags origin refs/pull/8208/head
          git checkout FETCH_HEAD

      - name: Syntax check
        shell: pwsh
        run: |
          node --check src/app.js
          node --check electron/main.cjs
          node --check electron/ai-local.cjs

      - name: Configure llama.cpp for Windows 7 CPU
        shell: pwsh
        run: |
          cmake -S llama-src -B llama-build `
            -DGGML_NATIVE=OFF `
            -DGGML_OPENMP=OFF `
            -DGGML_BLAS=OFF `
            -DGGML_CUDA=OFF `
            -DGGML_VULKAN=OFF `
            -DLLAMA_CURL=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_EXAMPLES=ON `
            -DLLAMA_BUILD_TOOLS=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DGGML_WIN_VER=_WIN32_WINNT_WIN7 `
            -DCMAKE_C_FLAGS="/D_WIN32_WINNT=0x0601 /DWINVER=0x0601" `
            -DCMAKE_CXX_FLAGS="/D_WIN32_WINNT=0x0601 /DWINVER=0x0601" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build llama-server
        shell: pwsh
        run: cmake --build llama-build --config Release --target llama-server --parallel

      - name: Validate prepared AI runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime/llama | Out-Null
          Copy-Item llama-build/bin/Release/llama-server.exe runtime/llama/llama-server.exe -Force
          $required = @(
            "runtime/llama/llama-server.exe",
            "runtime/models/Gemma3-1B-FP16-bnb-4bit-Q4_K_M.gguf",
            "runtime/models/harrier-oss-v1-0.6b.Q4_K_M.gguf",
            "runtime/ai-notice.txt"
          )
          foreach ($p in $required) {
            if (!(Test-Path $p)) { throw "Missing bundled runtime file: $p" }
          }
          foreach ($p in @(
            "runtime/models/Gemma3-1B-FP16-bnb-4bit-Q4_K_M.gguf",
            "runtime/models/harrier-oss-v1-0.6b.Q4_K_M.gguf"
          )) {
            $bytes = [System.IO.File]::ReadAllBytes($p)
            if ($bytes.Length -lt 4 -or $bytes[0] -ne 0x47 -or $bytes[1] -ne 0x47 -or $bytes[2] -ne 0x55 -or $bytes[3] -ne 0x46) {
              throw "Invalid GGUF file: $p"
            }
            Write-Host ("{0}: {1:N0} bytes" -f $p, (Get-Item $p).Length)
          }

      - name: Build Parin MindMap
        shell: pwsh
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.electron-builder-cache
        run: npm run dist:win7

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Parin-MindMap-Windows
          path: dist/Parin-MindMap-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload unpacked build for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Parin-MindMap-Unpacked
          path: dist/win-unpacked/
          if-no-files-found: warn
          retention-days: 7


  publish-release:
    name: Publish GitHub Release
    needs: build-windows
    if: ${{ success() && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: Parin-MindMap-Windows
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="$(find release-assets -maxdepth 1 -type f -name '*.exe' | head -n 1)"
          if [ -z "$FILE" ]; then
            echo "Windows installer not found"
            exit 1
          fi
          TAG="v0.1.0-build-${{ github.run_number }}"
          gh release create "$TAG" "$FILE"             --repo "${{ github.repository }}"             --title "Parin MindMap 0.1.0 — Windows"             --notes "Windows installer built from commit ${{ github.sha }}. Includes bundled Harrier + Gemma 3 local AI runtime."             --latest
