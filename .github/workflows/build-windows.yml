name: Build Parin MindMap (Windows)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      MODEL_URL: "https://huggingface.co/microsoft/Phi-3-mini-4k-instruct-gguf/resolve/main/Phi-3-mini-4k-instruct-q4.gguf"
    steps:
      - name: Checkout Parin MindMap
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Electron dependencies
        run: npm install --no-audit --no-fund

      - name: Checkout llama.cpp Windows 7 compatible revision
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama-src
          Set-Location llama-src
          git fetch --no-tags origin refs/pull/8208/head
          git checkout FETCH_HEAD

      - name: Syntax check
        shell: pwsh
        run: |
          node --check src/app.js
          node --check electron/main.cjs
          node --check electron/ai-local.cjs

      - name: Configure llama.cpp for Windows 7
        shell: pwsh
        run: |
          cmake -S llama-src -B llama-build `
            -DGGML_NATIVE=OFF `
            -DGGML_OPENMP=OFF `
            -DGGML_BLAS=OFF `
            -DGGML_CUDA=OFF `
            -DGGML_VULKAN=OFF `
            -DLLAMA_CURL=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=ON `
            -DGGML_WIN_VER=_WIN32_WINNT_WIN7 `
            -DCMAKE_C_FLAGS="/D_WIN32_WINNT=0x0601 /DWINVER=0x0601" `
            -DCMAKE_CXX_FLAGS="/D_WIN32_WINNT=0x0601 /DWINVER=0x0601" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build llama-server
        run: cmake --build llama-build --config Release --target llama-server --parallel

      - name: Prepare bundled AI runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime/llama | Out-Null
          New-Item -ItemType Directory -Force -Path runtime/models | Out-Null
          Copy-Item llama-build/bin/Release/llama-server.exe runtime/llama/llama-server.exe
          Invoke-WebRequest -Uri $env:MODEL_URL -OutFile runtime/models/Phi-3-mini-4k-instruct-q4.gguf -UseBasicParsing
          @"
          Parin MindMap local AI bundle

          Model: Microsoft Phi-3-mini-4k-instruct GGUF
          Quantization: Q4_K_M
          Model license: MIT
          Original model + GGUF: https://huggingface.co/microsoft/Phi-3-mini-4k-instruct-gguf

          Runtime: llama.cpp
          Runtime license: MIT
          Runtime source: https://github.com/ggml-org/llama.cpp

          The application uses the bundled model locally by default. Review the model and runtime licenses before redistributing modified builds.
          "@ | Set-Content -Encoding UTF8 runtime/ai-notice.txt

      - name: Build Parin MindMap
        run: npm run dist:win7

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Parin-MindMap-Windows
          path: dist/Parin-MindMap-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload unpacked build for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Parin-MindMap-Unpacked
          path: dist/win-unpacked/
          if-no-files-found: warn
          retention-days: 7