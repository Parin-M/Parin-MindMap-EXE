name: Build Parin MindMap (Windows)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      MODEL_REPO: "bartowski/Phi-3-mini-4k-instruct-GGUF"
      MODEL_FILE: "Phi-3-mini-4k-instruct-Q3_K_S.gguf"
    steps:
      - name: Checkout Parin MindMap
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Node dependencies without Electron binary download
        shell: pwsh
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          if ($LASTEXITCODE -ne 0) {
            Write-Host "npm install failed; retrying once..."
            npm cache verify
            npm install --no-audit --no-fund --ignore-scripts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Checkout llama.cpp Windows 7 compatible revision
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama-src
          Set-Location llama-src
          git fetch --no-tags origin refs/pull/8208/head
          git checkout FETCH_HEAD

      - name: Syntax check
        shell: pwsh
        run: |
          node --check src/app.js
          node --check electron/main.cjs
          node --check electron/ai-local.cjs

      - name: Configure llama.cpp for Windows 7
        shell: pwsh
        run: |
          cmake -S llama-src -B llama-build `
            -DGGML_NATIVE=OFF `
            -DGGML_OPENMP=OFF `
            -DGGML_BLAS=OFF `
            -DGGML_CUDA=OFF `
            -DGGML_VULKAN=OFF `
            -DLLAMA_CURL=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=ON `
            -DGGML_WIN_VER=_WIN32_WINNT_WIN7 `
            -DCMAKE_C_FLAGS="/D_WIN32_WINNT=0x0601 /DWINVER=0x0601" `
            -DCMAKE_CXX_FLAGS="/D_WIN32_WINNT=0x0601 /DWINVER=0x0601" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build llama-server
        run: cmake --build llama-build --config Release --target llama-server --parallel

      - name: Prepare bundled AI runtime
        shell: pwsh
        run: |
          $modelPath = "runtime/models/$env:MODEL_FILE"
          New-Item -ItemType Directory -Force -Path runtime/llama | Out-Null
          New-Item -ItemType Directory -Force -Path runtime/models | Out-Null
          Copy-Item llama-build/bin/Release/llama-server.exe runtime/llama/llama-server.exe

          python -m pip install --upgrade "huggingface_hub[hf_xet]"

          @'
          from huggingface_hub import hf_hub_download
          import os

          repo_id = os.environ["MODEL_REPO"]
          filename = os.environ["MODEL_FILE"]
          local_dir = os.path.join("runtime", "models")

          path = hf_hub_download(
              repo_id=repo_id,
              filename=filename,
              local_dir=local_dir,
              local_dir_use_symlinks=False,
              resume_download=True,
          )
          print(f"Downloaded model to: {path}")
          '@ | python -

          if (!(Test-Path $modelPath)) {
            throw "Model download failed: $modelPath does not exist."
          }

          $modelSize = (Get-Item $modelPath).Length
          Write-Host ("Model size: {0:N0} bytes" -f $modelSize)
          if ($modelSize -lt 1400000000 -or $modelSize -gt 1800000000) {
            throw "Model size is invalid; expected roughly 1.4-1.8 GB for $env:MODEL_FILE."
          }

          $stream = [System.IO.File]::OpenRead($modelPath)
          try {
            [byte[]]$magic = New-Object byte[] 4
            [void]$stream.Read($magic, 0, 4)
          } finally {
            $stream.Dispose()
          }
          if ($magic[0] -ne 0x47 -or $magic[1] -ne 0x47 -or $magic[2] -ne 0x55 -or $magic[3] -ne 0x46) {
            throw "Downloaded model is not a valid GGUF file."
          }

          @"
          Parin MindMap local AI bundle

          Base model: Microsoft Phi-3-mini-4k-instruct
          Quantization: Q3_K_S
          Quantized GGUF: bartowski/Phi-3-mini-4k-instruct-GGUF
          Model license: MIT
          Original model: https://huggingface.co/microsoft/Phi-3-mini-4k-instruct
          Quantized model: https://huggingface.co/bartowski/Phi-3-mini-4k-instruct-GGUF

          Runtime: llama.cpp
          Runtime license: MIT
          Runtime source: https://github.com/ggml-org/llama.cpp

          The model is bundled inside the Windows installer. Review the component licenses and notices before redistributing modified builds.
          "@ | Set-Content -Encoding UTF8 runtime/ai-notice.txt

      - name: Build Parin MindMap
        shell: pwsh
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.electron-builder-cache
        run: npm run dist:win7

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Parin-MindMap-Windows
          path: dist/Parin-MindMap-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload unpacked build for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Parin-MindMap-Unpacked
          path: dist/win-unpacked/
          if-no-files-found: warn
          retention-days: 7
