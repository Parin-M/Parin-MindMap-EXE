<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Parin MindMap">
  <defs>
    <linearGradient id="p" x1="90" y1="80" x2="405" y2="395" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5FE8FF"/><stop offset=".34" stop-color="#4B7BFF"/><stop offset=".68" stop-color="#9A64FF"/><stop offset="1" stop-color="#F56EDB"/>
    </linearGradient>
    <linearGradient id="leaf" x1="145" y1="360" x2="305" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#557BFF"/><stop offset=".55" stop-color="#B15CFF"/><stop offset="1" stop-color="#FF76B7"/>
    </linearGradient>
    <linearGradient id="n1"><stop stop-color="#5BE7FF"/><stop offset="1" stop-color="#4F76FF"/></linearGradient>
    <linearGradient id="n2"><stop stop-color="#C15CFF"/><stop offset="1" stop-color="#EF6ED5"/></linearGradient>
    <linearGradient id="n3"><stop stop-color="#FFC85D"/><stop offset="1" stop-color="#FF8C67"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".32"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#070B17"/>
  <circle cx="256" cy="250" r="190" fill="none" stroke="#496BFF" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="256" cy="250" r="150" fill="none" stroke="#B46CFF" stroke-opacity=".07" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <!-- conceptual P / flowing mind path -->
    <path d="M176 372V177c0-45 29-77 78-77h44c43 0 69 24 69 63 0 34-20 56-55 70l-67 27c-28 11-43 27-43 49 0 27 18 48 47 55-48 7-82-13-73-92Zm41-195v113c11-17 29-29 54-39l53-21c19-8 27-19 27-34 0-14-10-21-30-21h-65c-25 0-39 1-39 2Z" fill="url(#p)"/>
    <!-- leaf / open thought -->
    <path d="M157 389c36-13 71-9 111 12 24 13 47 19 71 17-27 31-63 47-104 47-42 0-70-24-78-76Z" fill="url(#leaf)"/>
  </g>

  <!-- three idea branches -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M314 212c40 0 54-29 83-29" stroke="#67DFFF" stroke-width="9"/>
    <path d="M313 253c45 0 61 1 91 1" stroke="#C66BFF" stroke-width="9"/>
    <path d="M309 292c39 0 56 25 88 25" stroke="#FFB35E" stroke-width="9"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="389" y="158" width="68" height="48" rx="16" fill="url(#n1)"/>
    <circle cx="410" cy="182" r="5.5" fill="#fff"/>
    <path d="M410 171v22M403 178h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>

    <rect x="400" y="230" width="74" height="48" rx="16" fill="url(#n2)"/>
    <path d="M418 246h30M418 257h22" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>

    <rect x="397" y="308" width="76" height="48" rx="16" fill="url(#n3)"/>
    <path d="M416 332l7 7 17-18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g opacity=".95">
    <circle cx="133" cy="146" r="3" fill="#7CEBFF"/>
    <circle cx="379" cy="101" r="2.7" fill="#A77DFF"/>
    <circle cx="105" cy="337" r="2.8" fill="#F58CDC"/>
  </g>
